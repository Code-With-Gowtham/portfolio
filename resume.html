<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Resume</title>

    <style>
        :root {
            --bg: #f3f6fb;
            --card: #ffffff;
            --primary: #dfeafc;
            --primary-dark: #cfe0ff;
            --primary-text: #183153;
            --text: #122033;
            --muted: #5b6474;
            --line: rgba(18, 32, 51, 0.08);
            --shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(180deg, #eef4ff 0%, #f6f7fb 100%);
            color: var(--text);
            min-height: 100vh;
        }

        .page-shell {
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px 24px 64px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 28px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--line);
        }

        .title-wrap {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .eyebrow {
            font-size: 0.78rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 700;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 2.8rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            color: var(--text);
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 220px;
            padding: 14px 22px;
            text-decoration: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--primary-text);
            border: 1px solid rgba(24, 49, 83, 0.1);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            box-shadow: 0 8px 18px rgba(24, 49, 83, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #d2e4ff 0%, #bed7ff 100%);
            box-shadow: 0 14px 28px rgba(24, 49, 83, 0.14);
        }

        .resume-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 18px;
        }

        .resume-container {
            width: 100%;
            margin: 0 auto;
            overflow: auto;
            background: var(--card);
            border-radius: 14px;
            border: 1px solid rgba(18, 32, 51, 0.06);
        }

        .resume-image {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
            border-radius: 12px;
        }

        @media (max-width: 640px) {
            .page-shell {
                padding-left: 14px;
                padding-right: 14px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .download-btn {
                width: 100%;
            }
        }
    </style>

</head>
<body>

<div class="page-shell">
    <div class="header">
        <div class="title-wrap">
            <span class="eyebrow">Portfolio</span>
            <h1>My Resume</h1>
        </div>

        <a href="resume.jpg"
           download="resume.jpg"
           class="download-btn">
           Download Resume
        </a>
    </div>

    <div class="resume-card">
        <div class="resume-container">
            <img class="resume-image" src="resume.jpg" alt="My Resume">
        </div>
    </div>
</div>

</body>
</html>
